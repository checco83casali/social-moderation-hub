<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>html{background:#0e0f11;color-scheme:dark}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<title>Offline — Moderation Hub</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/pwa/icon/192.png">
<link rel="apple-touch-icon" href="/pwa/icon/apple.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#0e0f11;color:#e8eaf0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#16181c;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:36px 28px;max-width:380px;width:100%;text-align:center}
  svg{width:44px;height:44px;color:#7a7f8e;margin-bottom:16px}
  h1{font-size:19px;margin-bottom:8px}
  p{font-size:14px;color:#9aa0ae;line-height:1.55;margin-bottom:22px}
  button{width:100%;min-height:48px;border:0;border-radius:12px;background:#4f8ef7;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button:active{background:#3a7de8}
</style>
</head>
<body>
<div class="card">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
  <h1>Sei offline</h1>
  <p>Non riesco a raggiungere il server. La moderazione richiede la connessione: i commenti non vengono salvati sul dispositivo.</p>
  <button onclick="location.reload()">Riprova</button>
</div>
</body>
</html>
