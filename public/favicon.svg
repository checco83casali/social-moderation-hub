<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Moderation Hub">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b9bff"/>
      <stop offset="1" stop-color="#3f6fe0"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf1ff"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile -->
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>

  <!-- Subtle top highlight -->
  <rect width="64" height="32" rx="15" fill="#ffffff" fill-opacity="0.08"/>

  <!-- Shield -->
  <path d="M32 11 L47 17 V31 C47 41.5 40 48 32 52.5 C24 48 17 41.5 17 31 V17 Z"
        fill="url(#shield)"/>

  <!-- Check mark -->
  <path d="M25 31.5 l4.8 4.8 L39 24.5"
        fill="none" stroke="#3ecf8e" stroke-width="4.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
